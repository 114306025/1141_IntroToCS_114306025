<!doctype html>
<html>
<head>
	<meta charset="utf-8">
    <title>114306025_Number Guessing Game</title>
</head>
<body>
    <h1>114306025_Number Guessing Game</h1>
    <div id="image"></div>
    <script>
        var answer = Math.floor(Math.random() * 100) + 1;
        var chances = 7;
        var min = 1;
        var max = 100;
        while (chances > 0) {
            var promptText = "請輸入 " + min + " 到 " + max + " 之間的整數。 \n" + "你還有 " + chances + " 次機會。";
            var input = window.prompt(promptText);
            if (input === null) {
                break;
            }
            var guess = Number(input);
            if (guess < min || guess > max) {
                alert("請輸入有效範圍內的數字(不能超出 " + min + " 到 " + max + " )!");
                continue;
            }
            if (guess === answer) {
                alert("恭喜你答對了！正確答案是 " + answer);
                img = document.getElementById("image");
                img.innerHTML = '<img src="correct.jpg" alt="correct" width="400">';
                break;
            } else {
                chances--;
                if (chances === 0) {
                    alert("遊戲結束，正確答案是 " + answer);
                    img = document.getElementById("image");
                    img.innerHTML = '<img src="wrong.jpg" alt="wrong" width="800">';
                    break;
                } else {
                    if (guess < answer) {
                        min = Math.max(min, guess + 1);
                        alert("數字太小了，再試一次!");
                    } else {
                        max = Math.min(max, guess - 1);
                        alert("數字太大了，再試一次!");
                    }
                }
            }
        }
    </script>
</body>
</html>
