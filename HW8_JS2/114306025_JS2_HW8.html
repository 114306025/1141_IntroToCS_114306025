<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114306025_JS2_HW8</title>
    <link rel="stylesheet" href="114306025_JS2_HW8.css">
</head>
<body>
    <div class="calculator-box">
        <h1>JS Calculator</h1>
        
        <label for="num1"><b>Number 1</b></label>
        <input type="number" id="num1" placeholder="Enter">

        <label for="num2"><b>Number 2</b></label>
        <input type="number" id="num2" placeholder="Enter">

        <label for="operator"><b>Operate way?</b></label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <button id="calcBtn">Add</button>

        <h2 id="resultDisplay">Result = 0.00</h2>
    </div>

    <script src="114306025_JS2_HW8.js"></script>
</body>
</html>
