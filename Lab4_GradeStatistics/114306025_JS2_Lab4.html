<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114306025_JS2_Lab4</title>
    <link rel="stylesheet" href="114306025_JS2_Lab4.css">
</head>
<body>
    <div class="container">
        <h1>Grade Statistics</h1>
        
        <div class="input-group">
            <input type="number" id="mathGrade" placeholder="Math">
            <input type="number" id="englishGrade" placeholder="English">
            <button id="submitBtn">Submit</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Math</th>
                    <th>English</th>
                    <th>Average</th>
                </tr>
            </thead>
            <tbody id="gradeTableBody">
                </tbody>
            <tfoot>
                <tr>
                    <td>Average</td>
                    <td id="mathAvg">0.00</td>
                    <td id="engAvg">0.00</td>
                    <td id="totalAvg">0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>
    <script src="114306025_JS2_Lab4.js"></script>
</body>
</html>
